name: Build Android APK

# Gera o APK na nuvem (sem precisar de Android Studio na sua máquina).
# Dispara em cada push na main e também manualmente (Actions > Run workflow).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Gerar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/roleta-tabuleiro.apk"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: roleta-tabuleiro-apk
          path: roleta-tabuleiro.apk

      - name: Publicar Release com link direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Roleta dos jogos — APK mais recente
          body: |
            APK gerado automaticamente. Baixe o arquivo **roleta-tabuleiro.apk** abaixo
            e instale no celular (permita "fontes desconhecidas").
          files: roleta-tabuleiro.apk
