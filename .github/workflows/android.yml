name: Build Android APK

# Gera o APK na nuvem (sem precisar de Android Studio na sua máquina).
# Dispara em cada push na main e também manualmente (Actions > Run workflow).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Garantir keystore estável (gera 1x e versiona)
        run: |
          if [ ! -f android/roleta.keystore ]; then
            keytool -genkeypair -v -keystore android/roleta.keystore \
              -alias roleta -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass roletajogos -keypass roletajogos \
              -dname "CN=Roleta dos jogos, OU=app, O=pessoal, C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/roleta.keystore
            git commit -m "chore: keystore estável de assinatura [skip ci]"
            git push
          fi

      - name: Gerar APK (release assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Pvc=${{ github.run_number }} -Pvn=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/roleta-tabuleiro.apk"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: roleta-tabuleiro-apk
          path: roleta-tabuleiro.apk

      - name: Publicar Release com link direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Roleta dos jogos — APK mais recente
          body: |
            APK gerado automaticamente. Baixe o arquivo **roleta-tabuleiro.apk** abaixo
            e instale no celular (permita "fontes desconhecidas").
          files: roleta-tabuleiro.apk
