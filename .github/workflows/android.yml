name: Build Android APK

# Gera o APK na nuvem (sem precisar de Android Studio na sua máquina).
# Dispara em cada push na main e também manualmente (Actions > Run workflow).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Gerar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: roleta-tabuleiro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
